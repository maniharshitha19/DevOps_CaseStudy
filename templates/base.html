<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <span class="brand">Pocket Ledger</span>
        <nav>
            <a href="{{ url_for('index') }}" id="nav-home">Expenses</a>
            <a href="{{ url_for('add') }}" id="nav-add">Add expense</a>
            <a href="{{ url_for('summary') }}" id="nav-summary">Summary</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
