{% extends 'base.html' %}
{% block title %}Expense saved{% endblock %}
{% block content %}
<div class="notice">
    <p id="message">Expense saved: {{ title }} for ₹{{ '%.2f' % amount }} under {{ category }}.</p>
    <p>
        <a href="{{ url_for('add') }}">Add another</a>
        <a href="{{ url_for('index') }}">View all expenses</a>
    </p>
</div>
{% endblock %}
